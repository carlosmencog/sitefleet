services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sitefleet
      POSTGRES_USER: sitefleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and change this value}
    ports:
      - "5432:5432"
    volumes:
      - sitefleet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitefleet -d sitefleet"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgres://sitefleet:${POSTGRES_PASSWORD}@postgres:5432/sitefleet
      SITEFLEET_ENCRYPTION_KEY: ${SITEFLEET_ENCRYPTION_KEY:?set a 32-byte base64 key in .env}
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    command: sh -c "npm run db:migrate --workspace=@sitefleet/api && node apps/api/dist/src/server.js"
  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sitefleet:${POSTGRES_PASSWORD}@postgres:5432/sitefleet
      REDIS_URL: redis://redis:6379
    command: node apps/api/dist/src/worker.js
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sitefleet:${POSTGRES_PASSWORD}@postgres:5432/sitefleet
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?set a dashboard username in .env}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set a dashboard password in .env}
      LOCAL_LIGHTHOUSE_RESOLVER_RULES: ${LOCAL_LIGHTHOUSE_RESOLVER_RULES:-MAP *.local host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    command: npm run start --workspace=@sitefleet/dashboard
volumes:
  sitefleet-postgres:
